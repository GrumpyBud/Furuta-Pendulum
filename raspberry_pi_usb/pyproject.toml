[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "furuta-pi"
version = "0.1.0"
description = "Temporary Raspberry Pi 5 USB controller for an ODrive Furuta pendulum"
requires-python = ">=3.11"
dependencies = [
  "odrive>=0.6.11,<0.7",
  "gpiozero>=2.0,<3",
  "spidev>=3.5,<4",
]

[project.scripts]
furuta-pi = "furuta_pi.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
